<section class="page">
  <header>
    <div>
      <p class="eyebrow">Access control</p>
      <h1>Roles</h1>
    </div>
    <div class="page-actions">
      <app-wiki-button wikiId="roles" />
      <button type="button" class="btn btn--ghost" (click)="reload()">
        <i class="fa-solid fa-rotate" aria-hidden="true"></i>
        Refresh
      </button>
    </div>
  </header>

  <app-inline-api-error [message]="error()" [reference]="errorRef()" />

  <form (ngSubmit)="save()" class="form wide">
    <label class="field">
      Key
      <input
        name="key"
        placeholder="e.g. qa_lead"
        [(ngModel)]="form.key"
        [disabled]="!!form.id"
        required
      />
    </label>
    <label class="field">
      Name
      <input name="name" placeholder="e.g. QA lead" [(ngModel)]="form.name" required />
    </label>
    <label class="field field--full">
      Description
      <input name="description" placeholder="Short description" [(ngModel)]="form.description" />
    </label>
    <label class="field field--full">
      Permissions
      <textarea
        name="permissions"
        rows="5"
        [(ngModel)]="form.permissions"
        spellcheck="false"
      ></textarea>
    </label>
    <div class="permission-chips field--full">
      <button
        type="button"
        *ngFor="let permission of permissionOptions"
        (click)="addPermission(permission)"
      >
        {{ permission }}
      </button>
    </div>
    <button type="submit" class="btn btn--primary">
      <i
        class="fa-solid"
        [class.fa-pen]="form.id"
        [class.fa-plus]="!form.id"
        aria-hidden="true"
      ></i>
      {{ form.id ? 'Update role' : 'Create role' }}
    </button>
    <button type="button" class="btn btn--ghost" *ngIf="form.id" (click)="cancel()">Cancel</button>
  </form>

  <div class="list-card" aria-label="Roles">
    <article *ngFor="let role of roles()" class="list-row">
      <div class="list-row__main">
        <span class="list-row__icon"
          ><i class="fa-solid fa-user-shield" aria-hidden="true"></i
        ></span>
        <div>
          <strong>{{ role.name }}</strong>
          <p class="list-row__meta">
            <code>{{ role.key }}</code>
            <span *ngIf="role.systemRole" class="badge">system</span>
          </p>
          <div class="permission-list">
            <span *ngFor="let permission of permissions(role)">{{ permission }}</span>
          </div>
        </div>
      </div>
      <div class="row-actions">
        <button type="button" class="btn btn--ghost" (click)="edit(role)">
          <i class="fa-solid fa-pen" aria-hidden="true"></i>
          Edit
        </button>
        <button
          type="button"
          class="btn btn--icon btn--danger"
          (click)="remove(role)"
          [disabled]="role.systemRole"
          [attr.aria-label]="'Delete role ' + role.name"
        >
          <i class="fa-solid fa-trash" aria-hidden="true"></i>
        </button>
      </div>
    </article>
  </div>

  <app-destructive-confirm-dialog />
</section>
